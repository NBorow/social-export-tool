name: Deploy to VM

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ig-export]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and restart
        run: bash deploy/deploy.sh "$GITHUB_WORKSPACE" "${{ vars.APP_DIR || '/home/nick/NCinstagramdl' }}"
